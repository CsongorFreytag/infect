<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QR-kód generátor – Oktatói eszközök</title>
  <script src="https://unpkg.com/qr-code-styling@1.6.0-rc.1/lib/qr-code-styling.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      padding: 2rem 1rem 3rem;
    }

    /* ── Header ── */
    header {
      display: flex;
      align-items: center;
      gap: 1rem;
      max-width: 900px;
      margin: 0 auto 2rem;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.45rem 1rem;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      color: #4a5568;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      white-space: nowrap;
      transition: background 0.15s, box-shadow 0.15s;
    }
    .back-btn:hover { background: #edf2f7; box-shadow: 0 1px 6px rgba(0,0,0,0.1); }
    h1 { font-size: 1.7rem; color: #2d3748; }

    /* ── Two-column grid ── */
    .container {
      max-width: 900px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      align-items: start;
    }
    @media (max-width: 660px) {
      .container { grid-template-columns: 1fr; }
    }

    /* ── Card panels ── */
    .panel {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.09);
      padding: 1.6rem;
    }
    .panel h3 {
      font-size: 1rem;
      color: #2d3748;
      margin-bottom: 1.1rem;
    }

    /* ── Tabs ── */
    .tabs {
      display: flex;
      gap: 0.45rem;
      margin-bottom: 1.4rem;
    }
    .tab-btn {
      flex: 1;
      padding: 0.55rem 0.3rem;
      border: 2px solid #e2e8f0;
      background: #f7fafc;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 700;
      color: #718096;
      cursor: pointer;
      transition: all 0.15s;
    }
    .tab-btn.active {
      border-color: #667eea;
      background: #ebf4ff;
      color: #434190;
    }
    .tab-btn:hover:not(.active) { background: #edf2f7; border-color: #cbd5e0; }

    /* ── Form elements ── */
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 700;
      color: #4a5568;
      margin-top: 0.85rem;
      margin-bottom: 0.28rem;
      letter-spacing: 0.01em;
    }
    label:first-of-type { margin-top: 0; }

    input[type=text],
    input[type=password],
    input[type=url],
    input[type=datetime-local],
    select,
    textarea {
      width: 100%;
      padding: 0.5rem 0.7rem;
      border: 1.5px solid #e2e8f0;
      border-radius: 7px;
      font-size: 0.9rem;
      color: #2d3748;
      background: #f7fafc;
      font-family: inherit;
      transition: border-color 0.15s, background 0.15s;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #667eea;
      background: #fff;
    }
    textarea { resize: vertical; min-height: 64px; }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.85rem;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      color: #4a5568;
      user-select: none;
    }
    .checkbox-label input[type=checkbox] {
      width: 16px;
      height: 16px;
      accent-color: #667eea;
      cursor: pointer;
      flex-shrink: 0;
    }

    /* ── Generate button ── */
    .gen-btn {
      width: 100%;
      margin-top: 1.3rem;
      padding: 0.72rem;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      border: none;
      border-radius: 9px;
      font-size: 0.97rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    .gen-btn:hover  { opacity: 0.91; transform: translateY(-1px); }
    .gen-btn:active { transform: translateY(0); }

    /* ── Right column ── */
    .right-col { display: flex; flex-direction: column; gap: 1.5rem; }

    /* ── QR preview ── */
    .qr-preview {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.1rem;
    }
    #qr-container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 210px;
      width: 100%;
    }
    #qr-container canvas { border-radius: 8px; max-width: 100%; }
    .placeholder {
      color: #a0aec0;
      font-size: 0.88rem;
      text-align: center;
      line-height: 1.6;
    }

    /* ── Download button ── */
    .dl-btn {
      width: 100%;
      padding: 0.65rem;
      background: #48bb78;
      color: #fff;
      border: none;
      border-radius: 9px;
      font-size: 0.94rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      transition: opacity 0.15s, transform 0.1s;
    }
    .dl-btn:hover  { opacity: 0.9; transform: translateY(-1px); }
    .dl-btn:active { transform: translateY(0); }
    .dl-btn:disabled {
      background: #cbd5e0;
      cursor: not-allowed;
      transform: none;
      opacity: 1;
    }

    /* ── Style controls ── */
    .color-row {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
    }
    .color-group { flex: 1; min-width: 120px; }

    .color-input-wrap {
      display: flex;
      gap: 0.4rem;
      align-items: center;
    }
    input[type=color] {
      width: 38px;
      height: 36px;
      padding: 2px;
      border: 1.5px solid #e2e8f0;
      border-radius: 6px;
      cursor: pointer;
      background: #f7fafc;
      flex-shrink: 0;
    }
    .hex-input {
      flex: 1;
      min-width: 0;
      padding: 0.45rem 0.55rem;
      border: 1.5px solid #e2e8f0;
      border-radius: 7px;
      font-size: 0.88rem;
      font-family: 'Cascadia Code', 'Consolas', monospace;
      color: #2d3748;
      background: #f7fafc;
      transition: border-color 0.15s, background 0.15s;
    }
    .hex-input:focus { outline: none; border-color: #667eea; background: #fff; }

    /* ── Roundness slider ── */
    .roundness-wrap { margin-top: 1.1rem; }
    .roundness-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.4rem;
    }
    .roundness-header label { margin: 0; }
    #round-val {
      font-size: 0.82rem;
      font-weight: 700;
      color: #667eea;
    }
    input[type=range] {
      width: 100%;
      accent-color: #667eea;
      cursor: pointer;
    }
    .range-labels {
      display: flex;
      justify-content: space-between;
      font-size: 0.74rem;
      color: #a0aec0;
      margin-top: 0.15rem;
    }

    footer {
      text-align: center;
      margin-top: 2.5rem;
      font-size: 0.8rem;
      color: #a0aec0;
    }
  </style>
</head>
<body>

  <header>
    <a class="back-btn" href="../index.html">&#8592; Vissza</a>
    <h1>QR-kód generátor</h1>
  </header>

  <div class="container">

    <!-- ═══ LEFT: Input panel ═══ -->
    <div class="panel">
      <div class="tabs">
        <button class="tab-btn active" data-tab="link">🔗 Link</button>
        <button class="tab-btn" data-tab="wifi">📶 WiFi</button>
        <button class="tab-btn" data-tab="event">📅 Esemény</button>
      </div>

      <!-- Link tab -->
      <div class="tab-content active" id="tab-link">
        <label for="link-url">URL / hivatkozás</label>
        <input type="url" id="link-url" placeholder="https://pelda.hu" />
        <button class="gen-btn" onclick="generate()">QR generálása</button>
      </div>

      <!-- WiFi tab -->
      <div class="tab-content" id="tab-wifi">
        <label for="wifi-ssid">Hálózat neve (SSID)</label>
        <input type="text" id="wifi-ssid" placeholder="OtthoniWifi" />

        <label for="wifi-enc">Titkosítás</label>
        <select id="wifi-enc" onchange="toggleWifiPass()">
          <option value="WPA">WPA / WPA2</option>
          <option value="WEP">WEP</option>
          <option value="nopass">Nyílt hálózat (jelszó nélkül)</option>
        </select>

        <div id="wifi-pass-wrap">
          <label for="wifi-pass">Jelszó</label>
          <input type="password" id="wifi-pass" placeholder="••••••••" />
        </div>

        <label class="checkbox-label">
          <input type="checkbox" id="wifi-hidden" />
          Rejtett hálózat (Hidden SSID)
        </label>

        <button class="gen-btn" onclick="generate()">QR generálása</button>
      </div>

      <!-- Event tab -->
      <div class="tab-content" id="tab-event">
        <label for="ev-title">Esemény neve</label>
        <input type="text" id="ev-title" placeholder="Konferencia 2025" />

        <label for="ev-start">Kezdés</label>
        <input type="datetime-local" id="ev-start" />

        <label for="ev-end">Befejezés</label>
        <input type="datetime-local" id="ev-end" />

        <label for="ev-loc">Helyszín</label>
        <input type="text" id="ev-loc" placeholder="Budapest, Kossuth tér 1." />

        <label for="ev-desc">Leírás</label>
        <textarea id="ev-desc" placeholder="Rövid leírás az eseményről..."></textarea>

        <button class="gen-btn" onclick="generate()">QR generálása</button>
      </div>
    </div>

    <!-- ═══ RIGHT: Preview + Style ═══ -->
    <div class="right-col">

      <!-- QR preview -->
      <div class="panel qr-preview">
        <div id="qr-container">
          <p class="placeholder">Add meg az adatokat,<br>majd kattints a „QR generálása" gombra.</p>
        </div>
        <button class="dl-btn" id="dl-btn" onclick="downloadQR()" disabled>
          ⬇ Letöltés PNG-ként
        </button>
      </div>

      <!-- Style controls -->
      <div class="panel">
        <h3>Megjelenés beállítása</h3>

        <div class="color-row">
          <div class="color-group">
            <label>Előtér szín</label>
            <div class="color-input-wrap">
              <input type="color" id="fg-picker" value="#000000" oninput="syncColor('fg')" />
              <input type="text" class="hex-input" id="fg-hex" value="#000000"
                     maxlength="7" placeholder="#000000" oninput="syncColorFromHex('fg')" />
            </div>
          </div>
          <div class="color-group">
            <label>Háttér szín</label>
            <div class="color-input-wrap">
              <input type="color" id="bg-picker" value="#ffffff" oninput="syncColor('bg')" />
              <input type="text" class="hex-input" id="bg-hex" value="#ffffff"
                     maxlength="7" placeholder="#ffffff" oninput="syncColorFromHex('bg')" />
            </div>
          </div>
        </div>

        <div class="roundness-wrap">
          <div class="roundness-header">
            <label>Lekerekítettség</label>
            <span id="round-val">0 %</span>
          </div>
          <input type="range" id="roundness" min="0" max="100" value="0" oninput="updateRoundness()" />
          <div class="range-labels">
            <span>▪ négyzet</span>
            <span>● kör / pont</span>
          </div>
        </div>
      </div>

    </div>
  </div>

  <footer>CsongorFreytag / infect – QR generátor</footer>

  <script>
    /* ───────────────────────────────────
       State
    ─────────────────────────────────── */
    let qrCode     = null;
    let activeData = '';
    let activeTab  = 'link';

    /* ───────────────────────────────────
       Tab switching
    ─────────────────────────────────── */
    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        activeTab = btn.dataset.tab;
        document.getElementById('tab-' + activeTab).classList.add('active');
      });
    });

    function toggleWifiPass() {
      const enc  = document.getElementById('wifi-enc').value;
      const wrap = document.getElementById('wifi-pass-wrap');
      wrap.style.display = enc === 'nopass' ? 'none' : 'block';
    }

    /* ───────────────────────────────────
       Data builders
    ─────────────────────────────────── */
    function escapeWifi(s) {
      return s
        .replace(/\\/g, '\\\\')
        .replace(/;/g,  '\\;')
        .replace(/,/g,  '\\,')
        .replace(/"/g,  '\\"')
        .replace(/:/g,  '\\:');
    }

    function fmtDt(dt) {
      // "2025-06-10T14:30" → "20250610T143000"
      return dt.replace(/[-:T]/g, '').padEnd(15, '0').slice(0, 15);
    }

    function buildData() {
      if (activeTab === 'link') {
        const url = document.getElementById('link-url').value.trim();
        if (!url) { alert('Kérlek adj meg egy URL-t!'); return null; }
        return url;
      }

      if (activeTab === 'wifi') {
        const ssid   = document.getElementById('wifi-ssid').value.trim();
        const enc    = document.getElementById('wifi-enc').value;
        const pass   = enc === 'nopass' ? '' : document.getElementById('wifi-pass').value;
        const hidden = document.getElementById('wifi-hidden').checked;
        if (!ssid) { alert('Kérlek add meg a hálózat nevét!'); return null; }
        return `WIFI:T:${enc};S:${escapeWifi(ssid)};P:${escapeWifi(pass)};H:${hidden ? 'true' : 'false'};;`;
      }

      if (activeTab === 'event') {
        const title = document.getElementById('ev-title').value.trim();
        const start = document.getElementById('ev-start').value;
        const end   = document.getElementById('ev-end').value;
        const loc   = document.getElementById('ev-loc').value.trim();
        const desc  = document.getElementById('ev-desc').value.trim();
        if (!title) { alert('Kérlek add meg az esemény nevét!'); return null; }
        const dates = (start || end)
          ? `${start ? fmtDt(start) : ''}/${end ? fmtDt(end) : fmtDt(start)}`
          : '';
        const params = new URLSearchParams();
        params.set('action', 'TEMPLATE');
        params.set('text', title);
        if (dates) params.set('dates', dates);
        if (loc)   params.set('location', loc);
        if (desc)  params.set('details', desc);
        return `https://calendar.google.com/calendar/render?${params.toString()}`;
      }

      return null;
    }

    /* ───────────────────────────────────
       Style mapping
    ─────────────────────────────────── */
    function getStyle() {
      const fg = /^#[0-9a-fA-F]{6}$/.test(document.getElementById('fg-hex').value)
        ? document.getElementById('fg-hex').value : '#000000';
      const bg = /^#[0-9a-fA-F]{6}$/.test(document.getElementById('bg-hex').value)
        ? document.getElementById('bg-hex').value : '#ffffff';
      const r = parseInt(document.getElementById('roundness').value, 10);

      // Map 0-100 → dot type
      let dotType, csType, cdType;
      if      (r < 20) { dotType = 'square';        csType = 'square';        cdType = 'square'; }
      else if (r < 40) { dotType = 'rounded';        csType = 'square';        cdType = 'square'; }
      else if (r < 60) { dotType = 'extra-rounded';  csType = 'extra-rounded'; cdType = 'square'; }
      else if (r < 80) { dotType = 'classy-rounded'; csType = 'extra-rounded'; cdType = 'dot';    }
      else             { dotType = 'dots';            csType = 'dot';           cdType = 'dot';    }

      return {
        dotsOptions:          { color: fg, type: dotType },
        backgroundOptions:    { color: bg },
        cornersSquareOptions: { color: fg, type: csType  },
        cornersDotOptions:    { color: fg, type: cdType  }
      };
    }

    /* ───────────────────────────────────
       Render
    ─────────────────────────────────── */
    function renderQR() {
      if (!activeData) return;
      const container = document.getElementById('qr-container');
      container.innerHTML = '';

      qrCode = new QRCodeStyling({
        width:  260,
        height: 260,
        type:   'canvas',
        data:   activeData,
        qrOptions:   { errorCorrectionLevel: 'M' },
        ...getStyle()
      });

      qrCode.append(container);
      document.getElementById('dl-btn').disabled = false;
    }

    function generate() {
      const data = buildData();
      if (data === null) return;
      activeData = data;
      renderQR();
    }

    function downloadQR() {
      if (!qrCode) return;
      const names = { link: 'qr-link', wifi: 'qr-wifi', event: 'qr-esemeny' };
      qrCode.download({ name: names[activeTab] || 'qr-kod', extension: 'png' });
    }

    /* ───────────────────────────────────
       Roundness & color controls
    ─────────────────────────────────── */
    function updateRoundness() {
      document.getElementById('round-val').textContent =
        document.getElementById('roundness').value + ' %';
      if (activeData) renderQR();
    }

    function syncColor(which) {
      const val = document.getElementById(which + '-picker').value;
      document.getElementById(which + '-hex').value = val;
      if (activeData) renderQR();
    }

    function syncColorFromHex(which) {
      const hex = document.getElementById(which + '-hex').value.trim();
      if (/^#[0-9a-fA-F]{6}$/.test(hex)) {
        document.getElementById(which + '-picker').value = hex;
        if (activeData) renderQR();
      }
    }
  </script>
</body>
</html>
